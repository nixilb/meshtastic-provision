# Project metadata for `uv`: `uv run provision_gui.py` (or provision_cli.py)
# creates the virtual environment, installs the dependencies and runs the
# script. Python 3.13 is pinned so every machine (laptop, Raspberry Pi) runs
# the same interpreter; PySide6-Essentials is Qt's widgets without the
# multimedia and web modules (80 MB instead of 150).
[project]
name = "meshtastic-provision"
version = "0.1.0"
description = "Flash a Meshtastic node over USB and apply a settings profile"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "esptool>=5.0",
    "meshtastic>=2.7",
    "pyyaml>=6.0",
    "requests>=2.32",
    "pyserial>=3.5",
    "PySide6-Essentials>=6.8",
]

[dependency-groups]
build = [
    "pyinstaller>=6.11",
]
